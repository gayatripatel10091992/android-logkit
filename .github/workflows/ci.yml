name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Library tests, AAR, sample, screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Library unit tests + lint + release AAR
        run: ./gradlew :logkit:testReleaseUnitTest :logkit:lintRelease :logkit:assembleRelease --stacktrace

      - name: Verify Maven publication (local)
        run: |
          ./gradlew :logkit:publishReleasePublicationToMavenLocal --stacktrace
          find ~/.m2/repository/io/github -name "logkit-*" | sort

      - name: Sample app + screenshots
        run: ./gradlew :sample:assembleDebug :sample:recordRoborazziDebug --stacktrace

      - name: Collect screenshots
        run: |
          mkdir -p docs/screenshots
          cp sample/build/outputs/roborazzi/*.png docs/screenshots/
          ls -la docs/screenshots

      - uses: actions/upload-artifact@v4
        with:
          name: logkit-build
          path: |
            logkit/build/outputs/aar/*.aar
            sample/build/outputs/apk/debug/*.apk

      - name: Commit updated screenshots
        if: github.event_name != 'pull_request'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
          else
            git commit -m "docs: update screenshots [skip ci]"
            git push
          fi
